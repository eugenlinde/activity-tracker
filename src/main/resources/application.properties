spring.application.name=activity-tracker
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.datasource.url=jdbc:postgresql://localhost:5432/tracker
spring.datasource.username=tracker
spring.datasource.password=tracker
jwt.secret=${JWT_SECRET}
jwt.expiration=24h
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
storage.root-path=./storage
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
signup.allowed-emails=${SIGNUP_ALLOWED_EMAILS:}
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.base-url=${OPENROUTER_BASE_URL:}
openrouter.model=${OPENROUTER_MODEL:}
openrouter.timeout=${OPENROUTER_TIMEOUT:60s}
error-report.github-token=${ERROR_REPORT_GITHUB_TOKEN:}
error-report.github-repo=${ERROR_REPORT_GITHUB_REPO:}
error-report.github-api-url=${ERROR_REPORT_GITHUB_API_URL:https://api.github.com}
error-report.max-per-hour=5
import.max-text-bytes=200000
import.daily-preview-limit=20
import.analysis-rows=40
