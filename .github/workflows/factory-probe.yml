name: Factory probe

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Throw-away branch the agent commits to, probe/<name>
        required: true
        type: string
      prompt:
        description: What the agent is asked to do
        required: true
        type: string
      claude_args:
        description: Arguments for the Claude program
        required: false
        type: string
        default: >-
          --model claude-sonnet-5-5
          --tools "Read,Grep,Glob,Edit,Write"
          --allowedTools "Read,Grep,Glob,Edit,Write,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
          --permission-mode dontAsk
          --max-budget-usd 2
      open_pr:
        description: Open a pull request for the branch before the agent runs
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  probe:
    if: ${{ vars.FACTORY_ENABLED == 'true' && github.actor == github.repository_owner && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: factory
    concurrency:
      group: factory-probe
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      BRANCH: ${{ inputs.branch }}
    steps:
      - name: Only a throw-away branch
        run: |
          if [[ ! $BRANCH =~ ^probe/[a-z0-9-]{1,40}$ ]]; then
            echo "The branch must be probe/<lowercase letters, digits, dashes>" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main

      - name: The branch with an empty first commit, and its pull request
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN_PR: ${{ inputs.open_pr }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit --allow-empty -m "probe: empty first commit"
          git push origin "$BRANCH"
          if [ "$OPEN_PR" = "true" ]; then
            gh pr create --base main --head "$BRANCH" --title "probe: $BRANCH" \
              --body "Throw-away pull request of the factory probe. Not for merging."
          fi

      - name: The agent (claude-code-action v1 at b5e3765)
        id: agent
        uses: anthropics/claude-code-action@b5e37652b7d48df841bfddfd6520610e19bf3136
        env:
          CLAUDE_BRANCH: ${{ inputs.branch }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ inputs.prompt }}
          use_commit_signing: true
          claude_args: ${{ inputs.claude_args }}

      - name: What happened
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ steps.agent.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        run: |
          {
            echo "### Probe $BRANCH"
            echo
            echo "Agent's conclusion: ${CONCLUSION:-none}"
            echo
            echo "Commits on the branch:"
            echo
            gh api "repos/$GITHUB_REPOSITORY/compare/main...$BRANCH" \
              --jq '.commits[] | "- `" + .sha[0:7] + "` by " + (.author.login // .commit.author.name // "?") + ", signed: " + (.commit.verification.verified | tostring)' || echo "- could not be read"
            echo
            echo "Files changed against main:"
            echo
            gh api "repos/$GITHUB_REPOSITORY/compare/main...$BRANCH" \
              --jq '.files[] | "- " + .status + " `" + .filename + "`"' || echo "- could not be read"
            echo
            if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
              echo "The run:"
              echo
              jq -r '[.[] | select(.type == "result")] | last
                | "- turns: " + ((.num_turns // "?") | tostring)
                + "\n- seconds: " + (((.duration_ms // 0) / 1000 | floor) | tostring)
                + "\n- cost estimate: " + ((.total_cost_usd // "?") | tostring)
                + "\n- refused tool calls: " + ([.permission_denials[]?.tool_name] | join(", ") | if . == "" then "none" else . end)' \
                "$EXECUTION_FILE" || echo "- the result could not be read"
              jq -r '[.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use") | .name]
                | group_by(.) | map(.[0] + " ×" + (length | tostring)) | "- tools called: " + (join(", ") | if . == "" then "none" else . end)' \
                "$EXECUTION_FILE" || echo "- the tool calls could not be read"
            else
              echo "No record of the run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
