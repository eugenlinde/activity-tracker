name: Factory gate

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the factory PR
        required: true
        type: string
      ci:
        description: CI result of the PR's latest commit
        required: true
        type: choice
        options: [success, failure]
      findings:
        description: Review findings, a JSON array of objects with a severity
        required: false
        type: string
        default: '[]'
      review_try:
        description: 2 when this is the review's second try after unreadable findings
        required: false
        type: choice
        options: ['1', '2']
        default: '1'
  workflow_call:
    inputs:
      pr:
        required: true
        type: string
      ci:
        required: true
        type: string
      findings:
        required: false
        type: string
        default: '[]'
      review_try:
        required: false
        type: string
        default: '1'

permissions: {}

jobs:
  gate:
    if: ${{ vars.FACTORY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: factory-pr-${{ inputs.pr }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Decide and act
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          CI_RESULT: ${{ inputs.ci }}
          FINDINGS: ${{ inputs.findings }}
          REVIEW_TRY: ${{ inputs.review_try }}
        run: |
          printf '%s' "$FINDINGS" > "$RUNNER_TEMP/findings.json"
          factory/run-gate.sh --repo "$REPO" --pr "$PR" --ci "$CI_RESULT" \
            --findings "$RUNNER_TEMP/findings.json" --review-try "$REVIEW_TRY"
