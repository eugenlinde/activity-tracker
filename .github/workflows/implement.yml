name: Implement

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Number of the issue to build
        required: true
        type: string

permissions: {}

concurrency:
  group: factory-issue-${{ github.event_name == 'workflow_dispatch' && inputs.issue || github.event.issue.number }}-${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'approved') && 'build' || 'other-label' }}
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  MODEL: ${{ vars.FACTORY_MODEL_IMPLEMENT || 'claude-sonnet-5-5' }}

jobs:
  prepare:
    if: >-
      ${{
        vars.FACTORY_ENABLED == 'true'
        && github.ref == 'refs/heads/main'
        && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'approved')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      number: ${{ steps.issue.outputs.number }}
      branch: ${{ steps.issue.outputs.branch }}
      pr: ${{ steps.open.outputs.pr }}
      prompt: ${{ steps.open.outputs.prompt }}
    steps:
      - name: The factory's own scripts, from main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Which issue, and may it be built
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ASKED_FOR: ${{ inputs.issue }}
          LABELLED: ${{ github.event.issue.number }}
          LABELLED_BY: ${{ github.event.sender.login }}
          STARTED_BY: ${{ github.actor }}
        run: |
          if [[ ! $MODEL =~ ^[A-Za-z0-9][A-Za-z0-9._:-]*$ ]]; then
            echo "The model's name is not a plain name" >&2
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            number=$ASKED_FOR
            sender=$STARTED_BY
          else
            number=$LABELLED
            sender=$LABELLED_BY
          fi
          if [[ ! $number =~ ^[1-9][0-9]{0,6}$ ]]; then
            echo "Not an issue number" >&2
            exit 1
          fi
          answer=$(factory/implement/check-issue.sh --repo "$REPO" --issue "$number" --sender "$sender" --out "$RUNNER_TEMP/implement")
          build=$(printf '%s\n' "$answer" | sed -n 's/^build=//p' | head -n 1)
          reason=$(printf '%s\n' "$answer" | sed -n 's/^reason=//p' | head -n 1)
          open=$(printf '%s\n' "$answer" | sed -n 's/^pr=//p' | head -n 1)
          case "$reason" in
            not-owner-label|not-owner-issue|closed|no-label|empty-spec|pr-open) ;;
            *) reason=failed ;;
          esac
          {
            echo "number=$number"
            echo "branch=factory/issue-$number"
          } >> "$GITHUB_OUTPUT"
          if [ "$build" = "yes" ]; then
            echo "build=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Not built: $reason"
          if [ "$reason" = "pr-open" ] && [[ $open =~ ^[1-9][0-9]{0,6}$ ]]; then
            factory/implement/report.sh refuse --repo "$REPO" --issue "$number" --reason pr-open --pr "$open"
          elif [ "$reason" = "pr-open" ]; then
            factory/implement/report.sh refuse --repo "$REPO" --issue "$number" --reason failed
          else
            factory/implement/report.sh refuse --repo "$REPO" --issue "$number" --reason "$reason"
          fi
          if [ "$reason" = "failed" ]; then
            exit 1
          fi

      - name: Open the pull request, with an empty first commit
        id: open
        if: ${{ steps.issue.outputs.build == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          if ! answer=$(factory/implement/open-pr.sh --repo "$REPO" --issue "$NUMBER" --title-file "$RUNNER_TEMP/implement/title.txt"); then
            factory/implement/report.sh refuse --repo "$REPO" --issue "$NUMBER" --reason failed
            exit 1
          fi
          pr=$(printf '%s\n' "$answer" | sed -n 's/^pr=//p' | head -n 1)
          if [[ ! $pr =~ ^[1-9][0-9]{0,6}$ ]]; then
            echo "No pull request number" >&2
            exit 1
          fi
          delimiter="prompt-$(openssl rand -hex 16)"
          {
            echo "pr=$pr"
            echo "prompt<<$delimiter"
            cat "$RUNNER_TEMP/implement/prompt.md"
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  agent:
    needs: prepare
    if: ${{ needs.prepare.outputs.pr != '' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/factory-agent.yml
    with:
      role: build
      number: ${{ needs.prepare.outputs.number }}
      branch: ${{ needs.prepare.outputs.branch }}
      pr: ${{ needs.prepare.outputs.pr }}
      prompt: ${{ needs.prepare.outputs.prompt }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
