<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15181D}
a{color:#A8B9A3}a:hover{color:#B8C8B3}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;color:#8E97A3;text-decoration:none;font-weight:500;font-size:15px;min-height:44px;box-sizing:border-box;flex:1 1 160px}
.nav a:hover{color:#E6E8EB;background:#22272E}
.nav a.on{color:#E6E8EB;background:#22272E}
.burger{display:none;font:inherit;background:transparent;border:1px solid #2E343D;border-radius:8px;color:#E6E8EB;width:44px;height:44px;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.burger:hover{background:#22272E}
@media (max-width: 760px){
  .nav{flex:1 1 100% !important;padding:8px 16px !important;border-right:0 !important;border-bottom:1px solid #22272E}
  .nav .logo{padding:0 !important}
  .burger{display:flex}
  .navlinks{display:none !important;padding:8px 0 10px}
  .navlinks.open{display:flex !important;flex-direction:column}
  .navlinks.open a{flex:1 1 auto}
  .navuser{display:none}
  main{padding:20px 16px 40px !important}
}
.btn{font:inherit;font-weight:500;font-size:14px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid #2E343D;background:#22272E;color:#E6E8EB;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#2A3039}
.btn.primary{background:#A8B9A3;color:#15181D;border-color:#A8B9A3}
.btn.primary:hover{background:#B8C8B3}
.btn.seg{min-height:34px;padding:0 12px;border-radius:8px;font-size:13px}
.btn.seg.on{background:#E6E8EB;color:#15181D;border-color:#E6E8EB}
.field{font:inherit;font-size:14px;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid #2E343D;background:#181C22;color:#E6E8EB;box-sizing:border-box}
.field:focus{outline:2px solid #A8B9A3;outline-offset:1px}
.row{display:grid;grid-template-columns:88px minmax(0,1fr) 52px;gap:14px;align-items:center;padding:14px 18px;border-radius:10px;background:#1B1F25;border:1px solid #22272E;color:#E6E8EB;text-decoration:none;min-height:64px;box-sizing:border-box}
.row:hover{border-color:#3A414B;background:#1F242B;color:#E6E8EB}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #15181D; color: #E6E8EB; font-family: Manrope, system-ui, sans-serif; font-size: 15px; line-height: 1.45">

<nav class="nav" aria-label="Main" style="flex: 1 1 220px; padding: 24px 16px; border-right: 1px solid #22272E; display: flex; flex-direction: column; gap: 6px; box-sizing: border-box">
  <div class="navtop" style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
    <div class="logo" style="font-family: Manrope, system-ui, sans-serif; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; padding: 6px 14px 18px; display: flex; align-items: center; gap: 10px">
      <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #A8B9A3"></span>
      tracker
    </div>
    <button type="button" class="burger" aria-label="Menu" aria-expanded="{{menuOpen}}" onClick="{{toggleMenu}}">
      <sc-if value="{{menuClosed}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></sc-if>
      <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
    </button>
  </div>
  <div class="navlinks {{menuCls}}" style="display: flex; flex-wrap: wrap; gap: 6px">
    <a href="Main.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"></rect><rect x="13" y="3" width="8" height="5" rx="1.5"></rect><rect x="13" y="12" width="8" height="9" rx="1.5"></rect><rect x="3" y="15" width="8" height="6" rx="1.5"></rect></svg>Dashboard</a>
    <a href="Workouts.dc.html" class="on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"></path></svg>Workouts</a>
    <a href="Templates.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 9h18M9 9v11"></path></svg>Templates</a>
    <a href="Aerobic.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"></path></svg>Aerobic</a>
    <a href="Diet.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16M5 11a7 7 0 0 1 14 0M3 15h18M6 15v3h12v-3"></path></svg>Diet</a>
    <a href="Shares.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"></path></svg>Shares</a>
    <a href="Import.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"></path></svg>Import</a>
  </div>
  <div class="navuser" style="margin-top: auto; padding: 14px; color: #8E97A3; font-size: 13px; line-height: 1.4">
    <div style="color: #E6E8EB; font-weight: 500">Eugen L.</div>
    <div>Signed in</div>
  </div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">

  <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
    <div>
      <div style="color: #8E97A3; font-size: 14px">{{count}} sessions · October 2026</div>
      <h1 style="margin: 0; font-family: Manrope, system-ui, sans-serif; font-size: 34px; font-weight: 500; line-height: 1.1; letter-spacing: -0.01em">Workouts</h1>
    </div>
    <a href="WorkoutDetail.dc.html" class="btn primary" style="text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New workout</a>
  </header>

  <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
    <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search workouts</label>
    <input id="q" class="field" type="search" placeholder="Search by name or exercise…" value="{{query}}" onInput="{{setQuery}}" style="flex: 1 1 260px; max-width: 420px">
    <div style="display: flex; gap: 6px" role="group" aria-label="Filter">
      <button type="button" class="btn seg {{segAll}}" onClick="{{filterAll}}">All</button>
      <button type="button" class="btn seg {{segShared}}" onClick="{{filterShared}}">With comments</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: grid; grid-template-columns: 88px minmax(0,1fr) 52px; gap: 14px; padding: 0 18px; font-size: 12px; color: #8E97A3">
      <div>Date</div><div>Session</div><div>Other</div>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <a href="WorkoutDetail.dc.html" class="row">
        <div style="min-width: 0">
          <div style="font-family: Manrope, system-ui, sans-serif; font-size: 19px; font-weight: 400; line-height: 1.1">{{r.day}}</div>
          <div style="font-size: 12px; color: #8E97A3">{{r.weekday}}</div>
        </div>
        <div style="min-width: 0">
          <div style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</div>
          <div style="font-size: 13px; color: #8E97A3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.summary}}</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-start; color: #8E97A3; font-size: 13px">
          <sc-if value="{{r.hasComments}}" hint-placeholder-val="{{true}}">
            <span style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 6px; background: #22272E; color: #E6E8EB; font-weight: 500; font-size: 12px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>{{r.comments}}</span>
          </sc-if>
          <sc-if value="{{r.hasMedia}}" hint-placeholder-val="{{true}}">
            <span style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 6px; background: #22272E; color: #E6E8EB; font-weight: 500; font-size: 12px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 16l5-5 4 4 3-3 6 6"></path></svg>{{r.media}}</span>
          </sc-if>
        </div>
      </a>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div style="padding: 40px; text-align: center; color: #8E97A3; background: #1B1F25; border: 1px dashed #2E343D; border-radius: 10px">No sessions match.</div>
    </sc-if>
  </div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { query: '', filter: 'all' };
  }
  renderVals() {
    const m = !!this.state.menuOpen;
    return { ...this.vals(), menuOpen: m, menuClosed: !m, menuCls: m ? 'open' : '', toggleMenu: () => this.setState({ menuOpen: !m }) };
  }
  vals() {
    const all = [
      { day: '22 Oct', weekday: 'Thursday', name: 'PPL 5/1', summary: 'Push A — Bench press · Incline DB press · Overhead press · Lateral raise · Triceps pushdown', comments: 3, media: 2 },
      { day: '20 Oct', weekday: 'Tuesday', name: 'PPL 4/3', summary: 'Legs — Back squat · Romanian deadlift · Leg press · Leg curl · Calf raise', comments: 1, media: 1 },
      { day: '17 Oct', weekday: 'Saturday', name: 'PPL 4/2', summary: 'Pull A — Deadlift · Pull-up · Barbell row · Face pull · Biceps curl', comments: 0, media: 0 },
      { day: '15 Oct', weekday: 'Thursday', name: 'PPL 4/1', summary: 'Push B — Overhead press · Dips · Cable fly · Lateral raise', comments: 2, media: 0 },
      { day: '13 Oct', weekday: 'Tuesday', name: 'PPL 3/3', summary: 'Legs — Front squat · Hip thrust · Bulgarian split squat · Leg curl', comments: 0, media: 1 },
      { day: '10 Oct', weekday: 'Saturday', name: 'PPL 3/2', summary: 'Pull B — Pull-up · Chest-supported row · Lat pulldown · Hammer curl', comments: 0, media: 0 },
      { day: '8 Oct', weekday: 'Thursday', name: 'PPL 3/1', summary: 'Push A — Bench press · Incline DB press · Overhead press · Lateral raise · Triceps pushdown', comments: 4, media: 3 },
      { day: '6 Oct', weekday: 'Tuesday', name: 'PPL 2/3', summary: 'Legs — Back squat · Romanian deadlift · Leg press · Calf raise', comments: 0, media: 0 },
      { day: '3 Oct', weekday: 'Saturday', name: 'PPL 2/2', summary: 'Pull A — Deadlift · Pull-up · Barbell row · Face pull', comments: 1, media: 0 },
      { day: '1 Oct', weekday: 'Thursday', name: 'PPL 2/1', summary: 'Push B — Overhead press · Dips · Cable fly · Lateral raise', comments: 0, media: 0 }
    ];
    const q = this.state.query.trim().toLowerCase();
    const rows = all
      .filter((r) => !q || (r.name + ' ' + r.summary).toLowerCase().includes(q))
      .filter((r) => this.state.filter === 'all' || r.comments > 0)
      .map((r) => ({ ...r, hasComments: r.comments > 0, hasMedia: r.media > 0 }));
    return {
      count: all.length,
      rows,
      empty: rows.length === 0,
      query: this.state.query,
      setQuery: (e) => this.setState({ query: e.target.value }),
      segAll: this.state.filter === 'all' ? 'on' : '',
      segShared: this.state.filter === 'shared' ? 'on' : '',
      filterAll: () => this.setState({ filter: 'all' }),
      filterShared: () => this.setState({ filter: 'shared' })
    };
  }
}
</script>
</body>
</html>
